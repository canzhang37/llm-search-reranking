name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the unit tests need no data, model or API key
      - run: pip install numpy==2.5.5 scipy==1.18.1 pytest==9.2.0
      - run: pytest -q tests
